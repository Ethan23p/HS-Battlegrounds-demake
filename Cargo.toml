[workspace]
resolver = "3"
members = ["crates/bg-sim", "crates/bg-cli", "crates/bg-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
wasm-bindgen = "0.2"
bg-sim = { path = "crates/bg-sim" }

[profile.release]
lto = "thin"
