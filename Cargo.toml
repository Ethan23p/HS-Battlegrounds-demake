[workspace]
resolver = "3"
members = ["crates/bg-sim", "crates/bg-cli", "crates/bg-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.12"
serde_json = "1"
bg-sim = { path = "crates/bg-sim" }

[profile.release]
lto = "thin"

# The web build is downloaded before anything can be played, so it optimises for
# size over speed. The engine's work is microseconds either way.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
