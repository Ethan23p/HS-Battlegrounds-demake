<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="playfield" id="battlefield">
    <div class="rank" id="opposing-rank">
      <div class="rank-label"><span class="dot"></span><span id="opposing-rank-label">Opposing party</span></div>
      <div class="row" id="opposing-row"></div>
    </div>

    <div class="spine">Action Phase</div>

    <div class="rank" id="player-rank">
      <div class="rank-label"><span class="dot"></span>Your board</div>
      <div class="row" id="player-row"></div>
    </div>

    <svg class="overlay arrows" aria-hidden="true">
      <defs>
        <marker id="arrow-player" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L8,4 L0,8 Z" style="fill: var(--indigo)"></path>
        </marker>
        <marker id="arrow-opposing" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L8,4 L0,8 Z" style="fill: var(--rust)"></path>
        </marker>
      </defs>
      <g id="arrow-lines"></g>
    </svg>
  </div>

  <!-- Everything that isn't the play field itself: the beat/result readout,
       controls, the outcome banner, and the log named after this whole
       thing -- Beat Ledger. Floating cards anchored top-right, independent
       of the playfield's own box, so neither ever competes with the other
       for width. -->
  <aside class="info">
    <div class="readout">
      <div class="field">
        <span class="label">Gold</span>
        <span class="value" id="gold-value">—</span>
      </div>
      <div class="field">
        <span class="label">Tier</span>
        <span class="value" id="tier-value">—</span>
      </div>
      <div class="field">
        <span class="label">Record</span>
        <span class="value" id="record-value">—</span>
      </div>
      <div class="field">
        <span class="label">Beat</span>
        <span class="value" id="beat-value">—</span>
      </div>
      <div class="field">
        <span class="label">Result</span>
        <span class="value" id="result-value">—</span>
      </div>
    </div>

    <div class="controls" id="shop-controls">
      <button class="transport" id="reroll">🎲 Reroll <span class="cost">1g</span></button>
      <button class="transport" id="freeze">❄ Freeze</button>
      <button class="transport" id="upgrade-tavern">⬆ Upgrade Tavern <span class="cost" id="upgrade-cost"></span></button>
      <button class="transport" id="fight">⚔ Fight</button>
    </div>

    <div class="controls" id="playback-controls" hidden>
      <div class="stepper">
        <button class="transport" id="prev" aria-label="Previous beat">‹ Prev</button>
        <button class="transport" id="next" aria-label="Next beat">Next ›</button>
      </div>
      <button class="transport" id="play">▶ Play</button>
      <button class="transport" id="reset">↺ Reset</button>
      <button class="transport" id="skip">⏭ Skip to end</button>
      <button class="transport" id="continue">Continue ⇥</button>
      <span class="speed-label">Speed</span>
      <select id="speed">
        <option value="600">Slow</option>
        <option value="300" selected>Normal</option>
        <option value="100">Fast</option>
      </select>
    </div>

    <div class="controls" id="run-over-controls" hidden>
      <span id="run-over-text"></span>
      <button class="transport" id="new-run">↺ New Run</button>
    </div>

    <div id="outcome"></div>
    <div id="shop-message" role="status"></div>

    <section class="dispatch">
      <button class="dispatch-label" id="log-toggle" aria-expanded="true" aria-controls="log">
        <span>Beat Ledger</span>
        <span class="chevron" aria-hidden="true">▾</span>
      </button>
      <div class="lines" id="log"></div>
    </section>
  </aside>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
